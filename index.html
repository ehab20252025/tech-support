<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيهاب تِك | مساعد الدعم الفني الذكي</title>
    
    <!-- ربط التطبيق كـ PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --main-color: #2c3e50; /* لون البليزر الرمادي */
            --accent-color: #3498db;
            --bg-color: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 0;
        }

        .header {
            background: linear-gradient(135deg, var(--main-color), #34495e);
            color: white; padding: 30px 20px; text-align: center;
            border-bottom-left-radius: 25px; border-bottom-right-radius: 25px;
        }

        .container { padding: 20px; max-width: 600px; margin: auto; }

        .search-container { position: relative; margin-top: -30px; margin-bottom: 25px; }
        .search-box {
            width: 100%; padding: 15px 45px 15px 15px;
            border-radius: 15px; border: none; font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); outline: none; box-sizing: border-box;
        }

        .btn-action {
            background-color: var(--accent-color); color: white; width: 100%;
            padding: 12px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .form-section {
            background: white; padding: 20px; border-radius: 15px;
            margin-bottom: 20px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .input-field {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
        }

        .card {
            background: white; padding: 20px; border-radius: 15px;
            margin-bottom: 15px; border-right: 5px solid var(--accent-color);
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .card h3 { margin: 0; color: var(--main-color); }
        .card p { color: #666; font-size: 14px; margin-top: 10px; white-space: pre-line; }
        
        .preview-img {
            width: 100%; border-radius: 10px; margin-top: 10px; display: none;
        }

        .badge {
            background: #e8f4fd; color: var(--accent-color);
            font-size: 11px; padding: 4px 10px; border-radius: 20px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-robot"></i> إيهاب تِك الذكي</h1>
    <p>أخصائي تشغيل نظم - ذاكرة الدعم الفني</p>
</div>

<div class="container">
    <div class="search-container">
        <input type="text" id="searchInput" class="search-box" placeholder="اسأل الذكاء الاصطناعي أو ابحث عن عطل...">
    </div>

    <button class="btn-action" id="toggleForm"><i class="fas fa-plus"></i> إضافة عطل/تصوير مشكلة</button>

    <div class="form-section" id="addForm">
        <input type="text" id="titleInput" class="input-field" placeholder="عنوان العطل (مثلاً: HP 432 - حشر)">
        <textarea id="solveInput" class="input-field" rows="3" placeholder="الحل (اتركه فارغاً ليسأل الذكاء الاصطناعي)"></textarea>
        
        <!-- ميزة التصوير المباشر -->
        <label for="cameraInput" class="btn-action" style="background:#95a5a6;">
            <i class="fas fa-camera"></i> تصوير/إرفاق صورة
        </label>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(this)">
        <img id="imgPreview" class="preview-img">

        <button class="btn-action" style="background:#27ae60;" onclick="processSubmission()">حفظ ومعالجة</button>
    </div>

    <div id="results"></div>
</div>

<script>
    let database = [
        { title: "HP 432 - عطل 59.F0", solve: "مشكلة في محرك النقل. فحص التروس الخلفية.", category: "طابعات", img: null },
        { title: "يوزرات نقاط البيع", solve: "تأكد من إعدادات الـ Proxy وتحديث الوقت.", category: "برمجيات", img: null }
    ];

    function handleImage(input) {
        const preview = document.getElementById('imgPreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function processSubmission() {
        const title = document.getElementById('titleInput').value;
        let solve = document.getElementById('solveInput').value;
        const img = document.getElementById('imgPreview').src;

        if (!title) return alert("يرجى كتابة عنوان العطل");

        // إذا كان الحل فارغاً، نقوم بمحاكاة رد الذكاء الاصطناعي
        if (!solve) {
            solve = `[رد تلقائي ذكي]: بناءً على خبرة م/ إيهاب في ${title}، يرجى فحص التوصيلات وتصفير العدادات. (سيتم ربط هذا الرد بـ Gemini لاحقاً)`;
        }

        database.unshift({ title, solve, category: "FAQ / ذكاء اصطناعي", img: img.startsWith('data') ? img : null });
        render();
        
        // إعادة تهيئة
        document.getElementById('addForm').style.display = 'none';
        document.getElementById('titleInput').value = '';
        document.getElementById('solveInput').value = '';
        document.getElementById('imgPreview').style.display = 'none';
    }

    function render(filter = '') {
        const container = document.getElementById('results');
        container.innerHTML = '';
        database.filter(i => i.title.includes(filter) || i.solve.includes(filter)).forEach(item => {
            container.innerHTML += `
                <div class="card">
                    <span class="badge">${item.category}</span>
                    <h3>${item.title}</h3>
                    <p>${item.solve}</p>
                    ${item.img ? `<img src="${item.img}" style="width:100%; border-radius:10px; margin-top:10px;">` : ''}
                </div>`;
        });
    }

    document.getElementById('toggleForm').onclick = () => {
        const f = document.getElementById('addForm');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    };

    document.getElementById('searchInput').oninput = e => render(e.target.value);
    render();
</script>
</body>
</html>
