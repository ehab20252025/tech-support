<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيهاب تِك AI | محلل الصور الفني</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; }
        .header { background: var(--primary); color: white; padding: 25px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        #preview { width: 100%; border-radius: 12px; display: none; margin-top: 15px; border: 2px solid #ddd; }
        #response { background: #fff; padding: 20px; border-radius: 15px; margin-top: 20px; display: none; text-align: right; line-height: 1.8; border-right: 6px solid var(--accent); white-space: pre-wrap; }
        .loader { display: none; margin: 20px 0; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1><i class="fas fa-eye"></i> إيهاب تِك - الرؤية الذكية</h1>
    <p>تحليل صور الأعطال (كاميرا / استوديو)</p>
</div>

<div class="container">
    <div class="card">
        <h3><i class="fas fa-upload"></i> ارفع صورة العطل</h3>
        <p style="font-size:13px; color:#666;">يمكنك تصوير العطل الآن أو اختيار صورة مخزنة من ذاكرة الموبايل.</p>
        
        <label class="btn" style="background: #27ae60;">
            <i class="fas fa-images"></i> اختيار صورة من الموبايل
            <input type="file" id="imageInput" accept="image/*" hidden onchange="handleImage(this)">
        </label>
        
        <img id="preview">
        
        <button id="analyzeBtn" class="btn" style="display:none; background:#e67e22;" onclick="analyzeWithAI()">
            <i class="fas fa-robot"></i> ابدأ التحليل بالذكاء الاصطناعي
        </button>

        <div class="loader" id="loader"><i class="fas fa-sync fa-spin"></i> جاري فحص الصورة واستخراج الحلول...</div>
    </div>

    <div id="response"></div>
    <p onclick="setApiKey()" style="font-size:11px; color:#bbb; margin-top:30px; cursor:pointer;">إعداد مفتاح الـ API</p>
</div>

<script>
    let API_KEY = localStorage.getItem('ehab_vision_key');
    let base64Data = "";

    function setApiKey() {
        const key = prompt("أدخل مفتاح Gemini API الخاص بك:");
        if(key) { localStorage.setItem('ehab_vision_key', key); API_KEY = key; alert("تم الحفظ!"); }
    }

    function handleImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                base64Data = e.target.result.split(',')[1];
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').style.display = 'block';
                document.getElementById('analyzeBtn').style.display = 'flex';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function analyzeWithAI() {
        if(!API_KEY) return setApiKey();
        
        const loader = document.getElementById('loader');
        const responseDiv = document.getElementById('response');
        loader.style.display = 'block';
        responseDiv.style.display = 'none';

        const payload = {
            contents: [{
                parts: [
                    { text: "أنت أخصائي تشغيل نظم خبير. انظر لهذه الصورة جيداً، تعرف على الجهاز (طابعة، سويتش، أو جهاز كمبيوتر)، حدد العطل الظاهر (مثل رسالة خطأ أو لمبات تحذير)، وقدم الحل التقني 'الزتونة' بلهجة مصرية مهنية." },
                    { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                ]
            }]
        };

        try {
            // استخدام المسار الصحيح والمحدث لتجنب خطأ 404
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if(data.error) throw new Error(data.error.message);

            const aiText = data.candidates[0].content.parts[0].text;
            responseDiv.innerHTML = "<strong>🔍 تحليل إيهاب تِك البصري:</strong><br><br>" + aiText;
            responseDiv.style.display = 'block';
        } catch (err) {
            alert("خطأ: " + err.message);
        } finally {
            loader.style.display = 'none';
        }
    }
</script>
</body>
</html>
